
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Teste MM - QOD</title>
  <style>
    /* Estilo do Fundo com a Imagem Personalizada */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Caixa de Cookies Flutuante na Cor Roxa */
    #cookie-banner {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 520px;
      background-color: #6a1b9a; /* Roxo */
      color: #ffffff;
      padding: 22px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      z-index: 999999;
      text-align: center;
      box-sizing: border-box;
    }

    /* Botões de Consentimento */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 18px;
    }

    .btn {
      padding: 10px 28px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease-in-out;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn-sim {
      background-color: #ffffff;
      color: #6a1b9a;
    }

    .btn-nao {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid #ffffff;
    }
  </style>
</head>
<body>

  <!-- Banner de Cookies Flutuante -->
  <div id="cookie-banner">
    <p style="margin: 0; font-size: 15px; line-height: 1.5; font-weight: 500;">
      Este site utiliza cookies para melhorar a sua experiência. Você aceita o uso de cookies de teste?
    </p>
    <div class="btn-container">
      <button class="btn btn-sim" onclick="responderCookie('sim')">Sim, Aceitar</button>
      <button class="btn btn-nao" onclick="responderCookie('nao')">Não, Recusar</button>
    </div>
  </div>

  <script>
    function responderCookie(opcao) {
      var dataExpiracao = new Date();
      dataExpiracao.setTime(dataExpiracao.getTime() + (7 * 24 * 60 * 60 * 1000));
      document.cookie = "consentimento_cookie=" + opcao + "; expires=" + dataExpiracao.toUTCString() + "; path=/";
      alert("Resposta salva no cookie: " + opcao.toUpperCase());
      document.getElementById('cookie-banner').style.display = 'none';
    }

    if (document.cookie.indexOf("consentimento_cookie=") !== -1) {
      document.getElementById('cookie-banner').style.display = 'none';
    }
  </script>

</body>
</html>
